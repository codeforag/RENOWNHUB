version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**

# Set environment variables `VITE_SUPABASE_URL` and `VITE_SUPABASE_ANON_KEY` in Amplify Console
